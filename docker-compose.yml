services:
  # ── Self-hosted draw.io editor ──
  drawio:
    image: jgraph/drawio:latest
    ports: ["8080:8080"]
    restart: unless-stopped
    networks:
      - app-network

  # ── Python AI backend (FastAPI) ──
  python-backend:
    build:
      context: ./backend
    ports: ["8000:8000"]
    env_file: .env          # base defaults (lower priority)
    environment:
      # ── These override anything in .env ──
      PORT: 8000
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:6002,http://next-ai-draw-io:3000"
      # ── AI Provider config ──
      # AI_PROVIDER: "anthropic"
      # AI_MODEL: "claude-sonnet-4-5-20250929"
      # ANTHROPIC_API_KEY: "sk-ant-..."
      # ── Or use OpenAI ──
      # AI_PROVIDER: "openai"
      # AI_MODEL: "gpt-4o"
      # OPENAI_API_KEY: "sk-..."
      # ── Or use Bedrock (default) ──
      # AWS_ACCESS_KEY_ID: "AKIA..."
      # AWS_SECRET_ACCESS_KEY: "..."
      # AWS_REGION: "us-east-1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

  # ── Next.js frontend ──
  next-ai-draw-io:
    build:
      context: .
      args:
        - NEXT_PUBLIC_DRAWIO_BASE_URL=http://localhost:8080
        # Uncomment below for subdirectory deployment
        # - NEXT_PUBLIC_BASE_PATH=/nextaidrawio
    ports: ["3000:3000"]
    env_file: .env
    environment:
      # Proxy all /api/* requests to the Python backend (server-side rewrite, no CORS needed)
      PYTHON_API_URL: http://python-backend:8000
    depends_on:
      drawio:
        condition: service_started
      python-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
